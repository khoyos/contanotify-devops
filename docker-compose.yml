version: '3.8'

services:
  # --- 1. BACKEND: Spring Boot (app-be) ---
  backend:
    build:
      context: ./backend/api-contanotify
      dockerfile: Dockerfile 
    container_name: spring-backend
    env_file:
      - ./backend/api-contanotify/.env 
    expose:
      - "8080"
    depends_on:
      - mongo
      - activemq
    networks:
      - app-network

  # --- 2. FRONTEND: ReactJS (app-fe) ---
  frontend:
    build:
      context: ./frontend/contanotifyapp
      dockerfile: Dockerfile 
    container_name: react-frontend
    env_file:
      - ./frontend/contanotifyapp/.env
    expose:
      - "80"
    networks:
      - app-network
      
  # --- 3. BASE DE DATOS: MongoDB (mongo) ---
  mongo:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: QAZ02026.*
    ports:
      - "27017:27017" # Se mantiene para acceder a la BD desde herramientas externas
    volumes:
      - mongo-data:/data/db 
    networks:
      - app-network

  # --- 4. MENSAJERÍA: ActiveMQ (activemq) ---
  activemq:
    image: rmohr/activemq:5.15.9 
    container_name: activemq
    ports:
      - "61616:61616"
      - "8161:8161"
    networks:
      - app-network

  # --- 5. REVERSE PROXY: Nginx (proxy) ---
  proxy:
    image: nginx:stable-alpine
    container_name: app-proxy
    ports:
      - "80:80" # El único puerto que debe estar abierto al público
    volumes:
      - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

# Redes y Volúmenes
networks:
  app-network:
    driver: bridge

volumes:
  mongo-data: